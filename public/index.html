
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Tool</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #fff;
      margin: 0;
      padding: 10px;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      font-size: 22px;
    }

    h2 {
      font-size: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      width: 100%;
      max-width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ff0000;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    button:hover:not(:disabled) {
      background: #cc0000;
    }

    button:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .box {
      background: #1e1e1e;
      padding: 12px;
      border-radius: 12px;
      margin-top: 15px;
    }

    #comments {
      max-height: 300px;
      overflow-y: auto;
    }

    .comment {
      border-bottom: 1px solid #333;
      padding: 10px 0;
    }

    .author {
      font-weight: bold;
      color: #ff5555;
      margin-bottom: 4px;
    }

    #transcript {
      max-height: 400px;
      overflow-y: auto;
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 15px;
    }

    .loading {
      opacity: 0.6;
      font-style: italic;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .button-group button {
      width: 100%;
    }

    #status {
      font-size: 14px;
      color: #bbb;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>YouTube Kommentare + Transkript</h1>

    <div class="input-group">
      <input
        id="url"
        type="text"
        placeholder="YouTube Link einfügen"
        autocomplete="off"
      >

      <div class="button-group">
        <button onclick="pasteAndStart()">
          Zwischenablage einfügen & starten
        </button>

        <button id="startButton" onclick="loadData()">
          Start
        </button>

        <button id="copyAllButton" onclick="copyAll()" disabled>
          Alles kopieren
        </button>

        <button id="copyCommentsButton" onclick="copyComments()" disabled>
          Nur Kommentare kopieren
        </button>

        <button id="copyTranscriptButton" onclick="copyTranscript()" disabled>
          Nur Transkript kopieren
        </button>
      </div>

      <div id="status" aria-live="polite">
        Füge einen YouTube-Link ein und drücke auf Start.
      </div>
    </div>

    <div class="box">
      <h2>Kommentare</h2>
      <div id="comments"></div>
    </div>

    <div class="box">
      <h2>Transkript</h2>
      <div id="transcript"></div>
    </div>

  </div>

  <script>
    const urlInput = document.getElementById("url");
    const commentsDiv = document.getElementById("comments");
    const transcriptDiv = document.getElementById("transcript");
    const statusDiv = document.getElementById("status");
    const startButton = document.getElementById("startButton");

    const copyButtons = [
      document.getElementById("copyAllButton"),
      document.getElementById("copyCommentsButton"),
      document.getElementById("copyTranscriptButton")
    ];

    let loadedUrl = "";
    let isLoading = false;

    function setCopyButtonsEnabled(enabled) {
      copyButtons.forEach(button => {
        button.disabled = !enabled;
      });
    }

    function invalidateLoadedData() {
      loadedUrl = "";
      setCopyButtonsEnabled(false);
    }

    // Bei einer Änderung des Links müssen die Daten neu geladen werden.
    urlInput.addEventListener("input", () => {
      invalidateLoadedData();
      statusDiv.textContent = urlInput.value.trim()
        ? "Link geändert. Drücke auf Start, um die Daten zu laden."
        : "Füge einen YouTube-Link ein und drücke auf Start.";
    });

    async function pasteAndStart() {
      try {
        const clipboardText = await navigator.clipboard.readText();
        const pastedUrl = clipboardText.trim();

        if (!pastedUrl) {
          statusDiv.textContent = "Die Zwischenablage ist leer.";
          return;
        }

        // Link einsetzen und direkt den Abruf starten.
        urlInput.value = pastedUrl;
        invalidateLoadedData();
        await loadData();

      } catch (error) {
        statusDiv.textContent =
          "Zwischenablage nicht lesbar. Bitte den Link manuell einfügen.";
      }
    }

    async function loadData() {
      if (isLoading) return;

      const url = urlInput.value.trim();

      if (!url) {
        statusDiv.textContent = "Bitte zuerst einen YouTube-Link einfügen.";
        urlInput.focus();
        return;
      }

      invalidateLoadedData();
      isLoading = true;
      startButton.disabled = true;

      commentsDiv.innerHTML =
        "<p class='loading'>Lade Kommentare...</p>";

      transcriptDiv.textContent = "Lade Transkript...";
      transcriptDiv.classList.add("loading");
      statusDiv.textContent = "Daten werden geladen...";

      try {
        const res = await fetch("/api", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ url })
        });

        if (!res.ok) {
          throw new Error("Serverfehler: " + res.status);
        }

        const data = await res.json();

        if (data.error) {
          throw new Error(data.error);
        }

        const comments = Array.isArray(data.comments)
          ? data.comments
          : [];

        const transcript = data.transcript || "";

        // Kommentare anzeigen
        commentsDiv.replaceChildren();

        if (comments.length === 0) {
          commentsDiv.textContent = "Keine Kommentare gefunden.";
        } else {
          comments.forEach(comment => {
            const commentElement = document.createElement("div");
            commentElement.className = "comment";

            const authorElement = document.createElement("div");
            authorElement.className = "author";
            authorElement.textContent = comment.author || "Unbekannt";

            const textElement = document.createElement("div");
            textElement.textContent = comment.text || "";

            commentElement.append(authorElement, textElement);
            commentsDiv.appendChild(commentElement);
          });
        }

        // Transkript anzeigen
        transcriptDiv.classList.remove("loading");
        transcriptDiv.textContent =
          typeof transcript === "string"
            ? transcript
            : String(transcript);

        // Kopieren erst nach erfolgreichem Abruf freigeben.
        loadedUrl = url;
        setCopyButtonsEnabled(true);
        statusDiv.textContent = "Fertig! Du kannst die Inhalte jetzt kopieren.";

      } catch (error) {
        commentsDiv.textContent = "Fehler beim Laden der Kommentare.";
        transcriptDiv.classList.remove("loading");
        transcriptDiv.textContent = "Fehler beim Laden des Transkripts.";

        statusDiv.textContent =
          "Fehler beim Laden: " + error.message;

        invalidateLoadedData();

      } finally {
        isLoading = false;
        startButton.disabled = false;
      }
    }

    function getCommentsText() {
      return Array.from(document.querySelectorAll(".comment"))
        .map(comment => {
          const author = comment.querySelector(".author")?.innerText || "";
          const text = comment.querySelector("div:last-child")?.innerText || "";
          return `${author}: ${text}`;
        })
        .join("\n");
    }

    function getTranscriptText() {
      return transcriptDiv.textContent || "";
    }

    async function copyText(text, successMessage) {
      if (!loadedUrl || loadedUrl !== urlInput.value.trim()) {
        statusDiv.textContent =
          "Bitte zuerst den aktuellen Link laden.";
        return;
      }

      try {
        await navigator.clipboard.writeText(text);
        statusDiv.textContent = successMessage;
      } catch (error) {
        statusDiv.textContent =
          "Kopieren fehlgeschlagen. Bitte die Browser-Berechtigung prüfen.";
      }
    }

    function copyComments() {
      copyText(getCommentsText(), "Kommentare wurden kopiert.");
    }

    function copyTranscript() {
      copyText(getTranscriptText(), "Transkript wurde kopiert.");
    }

    function copyAll() {
      const finalText =
`Neues Video neuer Kommentar.
Kommentare bisher:
${getCommentsText()}

Transkript:
${getTranscriptText()}`;

      copyText(finalText, "Kommentare und Transkript wurden kopiert.");
    }
  </script>
</body>
</html>
